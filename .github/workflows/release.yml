# Every change to the app that lands on main is tested and published as a release, versioned by date
# (v2026.10.09, then v2026.10.09.2 for a second one that day). Each release carries the app (app/, built by app.yml
# with the release's version: the Linux AppImage, the Windows installer and portable .exe, and the latest*.yml files
# the installed app updates from) and the old Tk version's zip, which zip copies update to and which points them to
# the app. Changes that only touch docs, tests or CI don't make a release; "Run workflow" on the Actions tab forces one.
# Pull requests run the tests only (app.yml builds the app for them).
name: Release

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "tests/**"
      - "mockups/**"
      - ".claude/**"
      - ".github/**"
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('test-{0}', github.ref) || 'release' }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Tk and a virtual display
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends python3-tk python3-pil.imagetk xvfb xauth mame-tools
      - name: Run tests
        run: tests/run.sh -v
      - name: Check Homebrew Hub, itch.io, PDRoms, MAMEDEV and ES-DE's release list (live; an outage there doesn't block releases)
        continue-on-error: true
        env:
          RETROSHELF_LIVE_TESTS: "1"
        run: >-
          tests/run.sh -v tests.test_core.LiveHomebrewHub tests.test_core.LiveItchIo tests.test_core.LivePdroms
          tests.test_core.LiveMamedev tests.test_core.LiveEsde

  test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Pillow (artwork in the details panel, screenshots)
        run: python -m pip install --quiet pillow
      - name: Run tests
        run: python -m unittest discover -s tests -t . -v
      - name: Screenshot RetroShelf on Windows
        if: always()
        run: python tests/sandbox.py --screenshot retroshelf-windows.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-screenshot
          path: retroshelf-windows.png
          if-no-files-found: ignore

  version:
    needs: [test, test-windows]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      version: ${{ steps.tag.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # tags, for the next free tag
      - id: tag
        run: .github/scripts/release.sh --tag >> "$GITHUB_OUTPUT"

  app:
    needs: version
    if: needs.version.outputs.tag
    uses: ./.github/workflows/app.yml
    with:
      version: ${{ needs.version.outputs.version }}

  release:
    needs: [version, app]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # tags and history, for the notes
      - uses: actions/download-artifact@v4
        with:
          pattern: retroshelf-app-*
          path: ${{ runner.temp }}/app-builds  # not assets/, which holds the repo's icons
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
          ASSETS: ${{ runner.temp }}/app-builds
        run: .github/scripts/release.sh
