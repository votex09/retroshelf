# Every change to the app that lands on main is tested and published as a release, versioned by date
# (v2026.10.09, then v2026.10.09.2 for a second one that day). Zip copies of RetroShelf update from these releases.
# Changes that only touch docs, tests or CI don't make a release; "Run workflow" on the Actions tab forces one.
# Pull requests run the tests only.
name: Release

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "tests/**"
      - ".claude/**"
      - ".github/**"
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('test-{0}', github.ref) || 'release' }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Tk and a virtual display
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends python3-tk python3-pil.imagetk xvfb xauth
      - name: Run tests
        run: tests/run.sh -v
      - name: Check Homebrew Hub, itch.io, PDRoms, MAMEDEV and ES-DE's release list (live; an outage there doesn't block releases)
        continue-on-error: true
        env:
          RETROSHELF_LIVE_TESTS: "1"
        run: >-
          tests/run.sh -v tests.test_core.LiveHomebrewHub tests.test_core.LiveItchIo tests.test_core.LivePdroms
          tests.test_core.LiveMamedev tests.test_core.LiveEsde

  test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Pillow (artwork in the details panel, screenshots)
        run: python -m pip install --quiet pillow
      - name: Run tests
        run: python -m unittest discover -s tests -t . -v
      - name: Screenshot RetroShelf on Windows
        if: always()
        run: python tests/sandbox.py --screenshot retroshelf-windows.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-screenshot
          path: retroshelf-windows.png
          if-no-files-found: ignore

  release:
    needs: [test, test-windows]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # tags and history, for the version number and the notes
      - name: Build and publish
        env:
          GH_TOKEN: ${{ github.token }}
          SS_DEVID: ${{ secrets.SCREENSCRAPER_DEVID }}
          SS_DEVPASSWORD: ${{ secrets.SCREENSCRAPER_DEVPASSWORD }}
        run: .github/scripts/release.sh
