<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; img-src 'self' data: rsmedia:; media-src rsmedia:; style-src 'self' 'unsafe-inline'">
  <title>RetroShelf</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand"><img src="icon-64.png" alt=""><span>RetroShelf</span><small id="version"></small></div>
    <div class="picker">
      <button class="system" id="system-btn" title="Pick a system (S)">
        <span class="system-tag" id="system-tag">—</span><span id="system-name">Pick a system</span><span class="chev">▾</span>
      </button>
      <div class="popover systems-pop" id="systems-pop" hidden>
        <div class="systems-list" id="systems-list"></div>
        <div class="pop-foot"><span class="path" id="roms-path"></span><button class="ghost small" id="change-roms">Change ROMs folder…</button></div>
      </div>
    </div>
    <label class="search"><span>⌕</span><input id="search" placeholder="Search games  ( / )" spellcheck="false"></label>
    <div class="space" id="space" hidden title="Free space on the drive your ROMs are on">
      <svg viewBox="0 0 36 36"><circle class="track" cx="18" cy="18" r="15"/><circle class="fill" id="space-ring" cx="18" cy="18" r="15"/></svg>
      <div><b id="free"></b><small>free</small></div>
    </div>
    <button class="update-btn" id="update-btn" hidden></button>
    <div class="menu-wrap">
      <button class="icon-btn" id="menu-btn" title="More">☰</button>
      <div class="popover menu" id="menu" hidden>
        <button data-cmd="holding">Holding folder…<small>see, restore or delete moved games</small></button>
        <button data-cmd="moves">Restore a move…<small>undo a whole Move</small></button>
        <button data-cmd="review">Review one at a time…<kbd>Ctrl+R</kbd></button>
        <button data-cmd="collection">Save as an ES-DE collection…</button>
        <hr>
        <button data-cmd="priority">Region priority…</button>
        <button data-cmd="export">Export move list…</button>
        <button data-cmd="rescan">Rescan<kbd>F5</kbd></button>
        <hr>
        <div class="menu-label">Tools</div>
        <div id="menu-tools"></div>
        <hr>
        <button data-cmd="change-holding">Change holding folder…</button>
        <button data-cmd="change-roms">Change ROMs folder…</button>
        <button data-cmd="launchbox">Download LaunchBox data</button>
        <hr>
        <button data-cmd="settings">Settings…<small>LaunchBox platform, theme, videos, gamepad, updates</small></button>
        <button data-cmd="keys">Keyboard and gamepad</button>
      </div>
    </div>
  </header>

  <main id="main">
    <section class="lists">
      <div class="filterbar" id="filterbar">
        <button class="tab" data-tab="presets">Presets &amp; ratings<span class="n"></span></button>
        <button class="tab" data-tab="genres">Genres<span class="n"></span></button>
        <button class="tab" data-tab="regions">Regions<span class="n"></span></button>
        <button class="tab" data-tab="patterns">Patterns<span class="n"></span></button>
        <span class="filter-info" id="filter-info"></span>
        <button class="ghost small" id="reset-flips" hidden>Reset flips</button>
      </div>
      <div class="popover filters" id="filters" hidden>
        <div class="panel" data-panel="presets">
          <div class="col" id="preset-list"></div>
          <div class="col">
            <label class="check"><input type="checkbox" id="use-rating"> Rating below
              <input type="number" id="rating-max" min="0" max="5" step="0.1"> / 5 if votes ≥
              <input type="number" id="min-votes" min="0" step="1"></label>
            <label class="check"><input type="checkbox" id="use-unrated"> Unrated or not in LaunchBox</label>
            <label class="check"><input type="checkbox" id="protect-played"> Protect played games <span id="played-n"></span></label>
            <p class="muted" id="match-info"></p>
          </div>
        </div>
        <div class="panel" data-panel="genres"><p class="muted">Games in any picked genre move.</p><div class="chips" id="genre-chips"></div></div>
        <div class="panel" data-panel="regions">
          <div class="modes" id="region-modes"></div>
          <p class="muted" id="region-help"></p>
          <div class="chips" id="region-chips"></div>
        </div>
        <div class="panel" data-panel="patterns">
          <textarea id="patterns" spellcheck="false" placeholder="One per line:
mario       contains “mario”
*(Beta)*    * and ? are wildcards
!kart       always keep
# note      ignored"></textarea>
          <label class="check"><input type="checkbox" id="icase"> Ignore case</label>
          <button class="link" id="pattern-help">How patterns work</button>
        </div>
      </div>
      <div class="columns">
        <div class="column" data-list="keep">
          <div class="col-head"><span class="dot keep"></span>Keeping <b class="count" id="keep-count">0</b><span class="size" id="keep-size"></span></div>
          <div class="list" id="keep"><div class="spacer"></div><div class="ring"></div><div class="empty" hidden></div></div>
        </div>
        <div class="column" data-list="move">
          <div class="col-head"><span class="dot move"></span>Moving <b class="count" id="move-count">0</b><span class="size" id="move-size"></span></div>
          <div class="list" id="move"><div class="spacer"></div><div class="ring"></div><div class="empty" hidden></div></div>
        </div>
      </div>
    </section>

    <aside class="details" id="details">
      <div class="backdrop" id="backdrop"></div>
      <div class="details-body" id="details-body"></div>
    </aside>
  </main>

  <footer>
    <div class="hints" id="hints"></div>
    <div class="actions">
      <button class="ghost" id="hide-btn" disabled title="Hide the Moving list's games in ES-DE instead of moving the files">Hide in ES-DE</button>
      <label class="dest">Move to
        <select id="dest"><option value="to_delete">to_delete</option><option value="review_low_value">review_low_value</option></select>
      </label>
      <button class="primary" id="move-btn" disabled>Move files</button>
    </div>
  </footer>
  <div class="toast" id="toast"></div>
  <div class="popover ctx" id="ctx" hidden></div>
  <div class="sheet-wrap" id="sheet-wrap" hidden><div class="sheet" id="sheet"></div></div>
  <div class="overlay" id="overlay" hidden><div class="overlay-box" id="overlay-box"></div></div>
  <script src="art.js"></script>
  <script src="list.js"></script>
  <script src="app.js"></script>
  <script src="sheets.js"></script>
  <script src="tools.js"></script>
  <script src="file-tools.js"></script>
  <script src="library-tools.js"></script>
  <script src="setup.js"></script>
  <script src="stores.js"></script>
  <script src="settings.js"></script>
</body>
</html>
